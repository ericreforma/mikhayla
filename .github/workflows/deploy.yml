# Builds the static export and publishes it to GitHub Pages.
#
# Requires one manual setting, once: Settings → Pages → Source → "GitHub
# Actions". Without it this workflow runs green and publishes nothing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# The token needs to be allowed to publish, and to prove who it is to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A newer push waits for the one in flight rather
# than cancelling it, so a half-published site is not left standing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # `output: "export"` writes the finished site to out/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
